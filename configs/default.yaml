## Configuration

Key hyperparameters in `configs/default.yaml`:

```yaml
model:
  n_channels: 18
  n_bands:    4
  embed_dim:  128
  num_layers: 2
  num_heads:  4
  dropout:    0.3

data:
  target_sfreq:       256
  window_sec:         2.0
  stride_sec:         1.0
  max_inter_per_file: 200

training:
  epochs:        50
  batch_size:    32
  learning_rate: 3.0e-4
  focal_alpha:   0.75
  focal_gamma:   2.0
  patience:      10
  smote_ratio:   0.2
```
